<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的記帳本</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>我的記帳本</h1>
    <div>
      <span id="user-name"></span>
      <button onclick="handleLogout()" class="btn-small">登出</button>
    </div>
  </header>

  <main class="dashboard">
    <section class="card">
      <h2>我的群組</h2>
      <div id="groups-list"></div>
      <button onclick="showCreateGroup()" class="btn-primary">建立新群組</button>
      <button onclick="showJoinGroup()" class="btn-secondary">用邀請碼加入</button>
    </section>

    <section class="card">
      <h2>記一筆帳</h2>
      <div class="form-row">
        <select id="tx-type">
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
        <input type="number" id="tx-amount" placeholder="金額" step="0.01">
        <input type="text" id="tx-note" placeholder="備註">
        <select id="tx-group">
          <option value="">個人</option>
        </select>
      </div>
      <button onclick="addTransaction()" class="btn-primary">記錄</button>
    </section>

    <section class="card">
      <h2>收支摘要</h2>
      <p>總收入：HK$<span id="total-income">0</span></p>
      <p>總支出：HK$<span id="total-expense">0</span></p>
      <p>結餘：HK$<span id="balance">0</span></p>
    </section>

    <section class="card">
      <h2>最近交易</h2>
      <div id="transactions-list"></div>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
