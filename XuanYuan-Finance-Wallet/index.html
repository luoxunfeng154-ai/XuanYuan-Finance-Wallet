<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的記帳本 - 登入</title>
  
  <!-- 1. 網頁樣式 -->
  <link rel="stylesheet" href="style.css">
  
  <!-- 2. 加載 Supabase 官方 SDK (必須先加載) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 3. 加載你自己的 Supabase 初始化文件 (定義 supabaseClient) -->
  <script src="supabase.js"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>我的記帳本</h1>
    
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">登入</button>
      <button class="tab" onclick="switchTab('register')">註冊</button>
    </div>

    <!-- 登入表單 -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <input type="email" id="login-email" placeholder="郵箱" required>
      <input type="password" id="login-password" placeholder="密碼" required>
      <button type="submit">登入</button>
    </form>

    <!-- 註冊表單 -->
    <form id="register-form" onsubmit="handleRegister(event)" style="display:none;">
      <input type="text" id="register-name" placeholder="顯示名稱" required>
      <input type="email" id="register-email" placeholder="郵箱" required>
      <input type="password" id="register-password" placeholder="密碼（至少 6 位）" required minlength="6">
      <button type="submit">註冊</button>
    </form>

    <p id="auth-message"></p>
  </div>

  <!-- 4. 最後加載認證邏輯 (使用 supabaseClient) -->
  <script src="auth.js"></script>
</body>
</html>
